<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>
</head>
<body>
  <button id="btn-print" onclick="generarPDF()" style="display:none; position:fixed; top:10px; right:10px; z-index:1000;">DESCARGAR PDF</button>
  <div id="area-impresion">
    <div id="contenido-dinamico">Esperando datos de Glide...</div>
  </div>

  <script>
    // Escuchar el mensaje que envía Glide
    window.addEventListener('message', function(event) {
      const { html, bg } = event.data;
      if (html) {
        document.getElementById('contenido-dinamico').innerHTML = html;
        document.getElementById('btn-print').style.display = 'block';
      }
      if (bg) {
        document.body.style.backgroundImage = `url('${bg}')`;
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundAttachment = 'fixed';
      }
    });

    function generarPDF() {
      const element = document.getElementById('area-impresion');
      html2pdf().set({ margin: 5, filename: 'Reporte.pdf', html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: 'mm', format: 'a4' } }).from(element).save();
    }
  </script>
</body>
</html>
